<!doctype html>
<!-- Source for social-card.png (1200x630). Rendered with headless Edge; see README. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..700,30&family=Inter:wght@500;600&family=Montserrat:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0b130f url('../ground/social-night.jpg') center / cover no-repeat;
    color: #eef3ef; font-family: Inter, system-ui, sans-serif; position: relative;
  }
  .grain { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,12,9,.94) 0%, rgba(6,12,9,.80) 42%, rgba(6,12,9,.25) 78%, rgba(6,12,9,.10) 100%); }
  .wrap { position: absolute; left: 76px; top: 70px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 18px; text-transform: uppercase; }
  .brand b { display: block; font: 700 22px/1 Montserrat; letter-spacing: .18em; color: #f3ead2; }
  .brand small { display: block; margin-top: 8px; font: 500 11px/1 Montserrat; letter-spacing: .36em; color: #c9aa6c; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 700; font-variation-settings: "opsz" 144, "SOFT" 30; font-size: 104px; line-height: .96; letter-spacing: -.03em; margin: 34px 0 22px; }
  h1 em { font-style: normal; color: #dcc38f; }
  p { font-size: 27px; line-height: 1.35; color: #c9d8ce; margin: 0; max-width: 600px; }
  .stats { position: absolute; left: 76px; bottom: 64px; display: flex; gap: 38px; }
  .stat b { display: block; font-family: Fraunces, Georgia, serif; font-size: 38px; font-weight: 600; color: #fff; letter-spacing: -.01em; }
  .stat span { font-size: 15px; color: #94b29f; letter-spacing: .02em; }
  .url { position: absolute; right: 64px; bottom: 30px; font-size: 16px; color: #7f9d8a; letter-spacing: .02em; }
  svg.field { position: absolute; right: -70px; top: 46px; width: 600px; }
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="brand"><img src="../logo.svg" width="62" height="62" alt=""><span><b>Best Eleven</b><small>Cricket selection lab</small></span></div>
  <h1>Pick the <em>best eleven.</em></h1>
  <p>Any national side, league or era, chosen from every ball bowled and every career on record.</p>
</div>
<div class="stats">
  <div class="stat"><b>23,080</b><span>matches</span></div>
  <div class="stat"><b>11.7m</b><span>deliveries valued</span></div>
  <div class="stat"><b>6,694</b><span>player profiles</span></div>
  <div class="stat"><b>1877</b><span>career records from</span></div>
</div>
<div class="url">bongo-seakhoa.github.io/best-eleven-lab</div>
</body>
</html>
