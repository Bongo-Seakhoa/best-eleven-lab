name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -e '.[dev]'
      - name: Python tests (network-free; includes the JS solver vs MILP parity check)
        run: pytest -q
      - name: JavaScript syntax
        run: find site -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
