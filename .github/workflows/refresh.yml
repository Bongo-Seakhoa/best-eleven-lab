name: Manually refresh one cricket source
on:
  workflow_dispatch:
    inputs:
      source:
        description: Provider archive
        type: choice
        options: [south_africa_male, tests_male, odis_male, t20s_male, tests_female, odis_female, t20s_female, ipl, sa20, bbl, psl]
        default: south_africa_male
        required: true
      format:
        type: choice
        options: [Test, ODI, T20]
        required: true
        default: Test
      team:
        description: Exact team name; blank is a mixed pool
        type: string
        default: South Africa
      gender:
        type: choice
        options: [male, female]
        default: male
      level:
        type: choice
        options: [international, club]
        default: international
permissions:
  contents: read
concurrency:
  group: cricket-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e .
      - name: Acquire, validate and analyse the selected source
        env:
          SOURCE: ${{ inputs.source }}
          FORMAT: ${{ inputs.format }}
          TEAM: ${{ inputs.team }}
          GENDER: ${{ inputs.gender }}
          LEVEL: ${{ inputs.level }}
        run: python scripts/refresh.py --source "$SOURCE" --format "$FORMAT" --team "$TEAM" --gender "$GENDER" --level "$LEVEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-analysis
          path: results/
          if-no-files-found: warn
          retention-days: 7
