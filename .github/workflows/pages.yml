name: Build and publish the site
# Checks Cricsheet weekly and publishes changed data after validation.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC, after Cricsheet's weekend updates
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      rebuild: ${{ steps.inputs.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4   # XI vs XI calibration runs the site engine
        with:
          node-version: '20'
      - name: Isolate the build dependencies
        run: |
          python -m venv "$RUNNER_TEMP/best-eleven-venv"
          echo "$RUNNER_TEMP/best-eleven-venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e .
      - name: Restore the last downloaded archive
        id: raw
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: cricsheet-${{ github.run_id }}
          restore-keys: cricsheet-
      - name: Fetch Cricsheet (conditional download)
        run: best-eleven fetch
      - name: Compare with the published build inputs
        id: inputs
        run: python -m best_eleven.pages
      - name: Cache verified source files by content
        if: steps.inputs.outputs.raw_cache_key != '' && steps.inputs.outputs.raw_cache_key != steps.raw.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: ${{ steps.inputs.outputs.raw_cache_key }}
      - name: Ingest, model, validate, export, calibrate XI vs XI
        id: rebuild
        if: steps.inputs.outputs.rebuild == 'true'
        run: best-eleven build
      - name: Log the validation report
        if: always() && steps.rebuild.outcome != 'skipped'
        run: cat data/model/validation.json || true
      - name: Record the validated inputs in the Pages artifact
        if: steps.inputs.outputs.rebuild == 'true' && steps.inputs.outputs.raw_cache_key != ''
        run: cp "$RUNNER_TEMP/best-eleven-build-inputs.json" site/data/build-inputs.json
      - uses: actions/configure-pages@v5
        if: steps.inputs.outputs.rebuild == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.inputs.outputs.rebuild == 'true'
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
