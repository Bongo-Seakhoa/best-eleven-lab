[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "best-eleven-lab"
version = "1.0.0"
description = "Pick a cricket Best XI for any national side, league or era from Cricsheet ball-by-ball data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Bongo Seakhoa"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pyarrow>=14",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "requests>=2.31,<3",
  "lxml>=5",
  "orjson>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
best-eleven = "best_eleven.cli:main"

[project.urls]
Homepage = "https://bongo-seakhoa.github.io/best-eleven-lab/"
Source = "https://github.com/Bongo-Seakhoa/best-eleven-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
